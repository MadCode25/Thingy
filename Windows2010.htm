<!DOCTYPE HTML>
<html>
<head>
    <title>Windows 2010</title>
    <style>
        body{
            margin:0;
            overflow:hidden;
            font-family:monospace;
        }

        #desktop{
            width:100vw;
            height:100vh;
            background:#1e1e2f;
            position:relative;
        }

        #taskbar{
            position:absolute;
            bottom:0;
            width:100%;
            height:40px;
            background:black;
        }
        
        #explorer-path{
            background-color: #eee;
            border: 2px solid #aaa;
            height: 13px;
        }

        #explorer-files{
            background-color: #eee;
            border: 1px solid #aaa;
            max-height: 300px;
            height: 250px;

        }

        button {
            padding: 12px;
            background-color: #0b4470;
            border-radius: 5px;
            border: none;
            cursor:pointer;
        }

        .window{
            position:absolute;
            top:100px;
            left:100px;
            background:white;
            border:2px solid black;
            z-index:1;
        }

        .titlebar{
            background:#444;
            color:white;
            user-select: none;
            padding:5px;
        }
        

        .content{
            padding:10px;
        }

        .close{
            float:right;
            background:red;
            color:white;
            border:none;
            cursor:pointer;
            padding:2px 6px;
            font-size:12px;
            line-height:1;
        }

        .regedit{
            display:flex;
            height:100%;
            font-size:13px;
        }

        .regtree{
            width:200px;
            background:#eee;
            border-right:1px solid #aaa;
            padding:5px;
        }

        .regvalues{
            flex:1;
            padding:10px;
        }

        .regkey{
            cursor:pointer;
            padding:2px;
        }

        .regkey:hover{
            background:#cce5ff;
        }
        
        #terminal-output {
            height: 100px;
            overflow-y: scroll;
            padding: 10px;
            background-color: black;
        }
        #terminal-input-container {
            padding: 10px;
        }
        #terminal-input {
            background-color: black;
            color: green;
            border: none;
            outline: none;
            width: calc(100% - 20px);   
        }
    </style>
</head>
<body>
<div id="desktop"></div>

<div id="taskbar">
    <button onclick="openApp('Terminal')">Terminal</button>
    <button onclick="openApp('MrHi')">Mr. Hi</button>
    <button onclick="openApp('RegEdit')">Registry Editor</button>
    <button onclick="openApp('Explorer')">File Explorer</button>
    <button onclick="openApp('AmadOS Apps')">AmadOS Apps</button>
    <button onclick="openApp('SpeedRun')">Run</button>
</div>

<script>
let currentWindow = null;
let offsetX = 0, offsetY = 0;
let currRegKey = null;

const desktop = document.getElementById("desktop");


/* =========================
   SYSTEM FILE RUNNER
========================= */

function runFile(path){

    let folder = filesystem;

    for(let p of path){

        if(!folder[p]){
            createWindow(
                "System Error",
                `Missing system file:<br>${path.join("/")}`,
                "syserr",
                300,
                150
            );
            return;
        }

        folder = folder[p];
    }

    if(typeof folder === "function"){
        folder();
    }

    else if(typeof folder === "string"){
        createWindow(path[path.length-1], `<pre>${folder}</pre>`, "txt", 300, 200);
    }
}


/* =========================
   REGISTRY
========================= */

const aasc = `
<div style="text-align: center;">
<h1>Welcome!</h1>
</div>
<div style="background-color: #eee; border: 2px solid #aaa; text-align: center; overflow: scroll; height: 340px;">
<h1>What app do you want to get?</h1>
Note that some of these<br>apps are developed by AmadOS itself.<br><br>
<button onclick="openAppDetails('acm')" id='acm'>ACM</button>
</div>
`;

const terminal = `
<div id="terminal-output"></div>
<div id="terminal-input-container">
<span style="color: green;">></span>
<input type="text" id="terminal-input" autofocus>
</div>
`;

let registry = {

HKEY_WINDOW:{

Terminal:{
width:300,
height:200,
content:terminal
},

MrHi:{
width:400,
height:150,
content:`<h2>Mr. Hi says hi</h2>`
},

SpeedRun:{
width:350,
height:160,
content:`
<p>Type the name of a program, and Windows will open it for you.</p>
<input id="program">
<button onclick="openApp(document.getElementById('program').value)">Run</button>
`
},

"AmadOS Apps":{
width:650,
height:500,
content:aasc
}

},

HKEY_DESKTOP:{
BG:{r:30,g:30,b:47}
}

};



let filesystem = {

"C:":{

/* =========================
   SYSTEM FILES
========================= */

System:{

System32:{

/* core boot files */

"boot.sys":()=>bootSystem(),

"kernel.dll":()=>console.log("Kernel loaded"),

"ui.dll":()=>console.log("UI library loaded"),

"explorer.dll":()=>console.log("Explorer engine loaded"),

"registry.dll":()=>console.log("Registry engine loaded"),

"fs.dll":()=>console.log("Filesystem driver loaded"),


/* system utilities */

"package_mg.exe":{
depends:[
["C:","System","System32","ui.dll"]
],
run:()=>openApp("AmadOS Apps")
},

"regedit.exe":{
depends:[
["C:","System","System32","ui.dll"],
["C:","System","System32","registry.dll"]
],
run:()=>openApp("RegEdit")
}

}

},

/* =========================
   PROGRAMS
========================= */

Programs:{

"explorer.exe":{
depends:[
["C:","System","System32","explorer.dll"],
["C:","System","System32","ui.dll"],
["C:","System","System32","fs.dll"]
],
run:()=>openApp("Explorer")
},

"terminal.exe":{
depends:[
["C:","System","System32","ui.dll"]
],
run:()=>openApp("Terminal")
},

"mrhi.exe":{
depends:[
["C:","System","System32","ui.dll"]
],
run:()=>openApp("MrHi")
}

},

/* =========================
   USERS
========================= */

Users:{

guest:{

"readme.txt":`Welcome to Windows 2010!

This is your home folder.
Use Explorer to navigate files.`,

Downloads:{

"update.log":`March 10 2026 - Windows 2010 created
March 11 2026 - Added Explorer
March 12 2026 - Added registry keys
March 13 2026 - Added dependency system`

},
"IMPORTANT": `Crazygame's Pass and Username:<br>LOLZER.4hx (username)<br>wowitis19 (password)<br><br>Link to AOSCGL:<br>https://www.programiz.com<br>/online-compiler/<br>5xlGwX8C5rDBB<br>New: https://www.programiz.com<br>/online-compiler/<br>39JxaqjdXiZoS`

}

},

/* =========================
   OPTIONAL WINDOWS STYLE
========================= */

Windows:{

System32:{

"notepad.exe":{
depends:[
["C:","System","System32","ui.dll"]
],
run:()=>createWindow("Notepad","<textarea style='width:100%;height:90%'></textarea>","notepad",400,300)
}

}

}

}

};

let currentPath=["C:"];



/* =========================
   PROGRAM RUNNER
========================= */

function runProgram(file){

if(file.depends){

for(let dep of file.depends){

let folder=filesystem;

for(let p of dep){

if(!folder[p]){

createWindow(
"Program Error",
`Missing dependency:<br>${dep.join("/")}`,
"err",
300,
150
);

return;
}

folder=folder[p];
}

if(typeof folder==="function"){
folder();
}

}

}

file.run();

}



/* =========================
   WINDOW SYSTEM
========================= */

function createWindow(title,content,id,w,h){

let win=document.createElement("div");
win.className="window";
win.id="win-"+id;

win.style.width=w+"px";
win.style.height=h+"px";

win.innerHTML=`
<div class="titlebar">
${title}
<button class="close">X</button>
</div>
<div class="content">${content}</div>
`;

desktop.appendChild(win);

win.querySelector(".close").onclick=()=>win.remove();

let titlebar=win.querySelector(".titlebar");

titlebar.onmousedown=(e)=>{
currentWindow=win;
offsetX=e.clientX-win.offsetLeft;
offsetY=e.clientY-win.offsetTop;
};

}



/* =========================
   OPEN APPLICATIONS
========================= */

function openApp(appName){

let cfg=registry.HKEY_WINDOW[appName];

if(appName==="RegEdit"){

createWindow("Registry Editor",`
<div class="regedit">
<div class="regtree" id="regtree"></div>
<div class="regvalues" id="regvalues">Select a key.</div>
</div>
`,"regedit",500,300);

loadRegistryTree();
return;
}

if(appName==="Explorer"){

createWindow("File Explorer",`
<button onclick="goBack()" class='close'>⬅ Back</button>
<div id="explorer-path"></div>
<div id="explorer-files"></div>
`,"explorer",500,350);

renderExplorer();
return;
}

if(cfg){
createWindow(appName,cfg.content,appName,cfg.width,cfg.height);
}
else{
createWindow("Warning",`<p>${appName} not found.</p>`,"warn",300,150);
}

}



/* =========================
   REGISTRY EDITOR
========================= */

function loadRegistryTree(){

let tree=document.getElementById("regtree");
tree.innerHTML="";

for(let root in registry){

let div=document.createElement("div");
div.textContent=root;
div.className="regkey";

div.onclick=()=>showSubKeys(root);

tree.appendChild(div);
}

}

function showSubKeys(root){

let tree=document.getElementById("regtree");
tree.innerHTML="";

for(let key in registry[root]){

let div=document.createElement("div");

div.textContent=" - "+key;
div.className="regkey";

div.onclick=()=>showValues(root,key);

tree.appendChild(div);

}

}

function showValues(root,key){

let values=document.getElementById("regvalues");
let data=registry[root][key];

currRegKey={root,key};

if(root==="HKEY_WINDOW"){

values.innerHTML=`
<h3>${key}</h3>

Width:
<input id="reg-width" value="${data.width}"><br><br>

Height:
<input id="reg-height" value="${data.height}"><br><br>

<button onclick="saveRegVal()">Save</button>
`;

}

if(root==="HKEY_DESKTOP"){

values.innerHTML=`
<h3>Desktop Color</h3>

R: <input id="reg-r" value="${data.r}"><br>
G: <input id="reg-g" value="${data.g}"><br>
B: <input id="reg-b" value="${data.b}"><br><br>

<button onclick="saveRegVal()">Apply</button>
`;

}

}

function saveRegVal(){

if(!currRegKey)return;

let {root,key}=currRegKey;
let cfg=registry[root][key];

if(root==="HKEY_WINDOW"){

cfg.width=parseInt(document.getElementById("reg-width").value);
cfg.height=parseInt(document.getElementById("reg-height").value);

let win=document.getElementById("win-"+key);

if(win){
win.style.width=cfg.width+"px";
win.style.height=cfg.height+"px";
}

}

if(root==="HKEY_DESKTOP"){

cfg.r=parseInt(document.getElementById("reg-r").value);
cfg.g=parseInt(document.getElementById("reg-g").value);
cfg.b=parseInt(document.getElementById("reg-b").value);

desktop.style.backgroundColor=`rgb(${cfg.r},${cfg.g},${cfg.b})`;

}

}



/* =========================
   FILE EXPLORER
========================= */

function getFolder(path){

let folder=filesystem;

for(let p of path){
folder=folder[p];
}

return folder;

}

function deleteFile(name){

    let folder = getFolder(currentPath);

    if(!folder[name]){
        createWindow("Error","File not found.","err",250,120);
        return;
    }

    if(!confirm("Delete " + name + "?")) return;

    delete folder[name];

    renderExplorer();
}

function renderExplorer(){

    let pathDiv=document.getElementById("explorer-path");
    let fileDiv=document.getElementById("explorer-files");

    if(!fileDiv) return;

    let folder=getFolder(currentPath);

    pathDiv.textContent=currentPath.join("/");

    fileDiv.innerHTML="";

    for(let name in folder){

        let item=document.createElement("div");

        item.style.display="flex";
        item.style.justifyContent="space-between";
        item.style.marginBottom="4px";

        let nameSpan=document.createElement("span");
        nameSpan.textContent=name;
        nameSpan.style.cursor="pointer";
        nameSpan.onclick=()=>openFile(name);

        let delBtn=document.createElement("button");
        delBtn.textContent="Delete";
        delBtn.className = "close";
        delBtn.onclick=()=>deleteFile(name);

        item.appendChild(nameSpan);
        item.appendChild(delBtn);
        fileDiv.appendChild(item);
    }
}

function openFile(name){

let folder=getFolder(currentPath);
let file=folder[name];

if(typeof file==="object" && !file.run){

currentPath.push(name);
renderExplorer();

}

else if(typeof file==="object" && file.run){

runProgram(file);

}

else if(typeof file==="function"){

file();

}

else{

createWindow(name,`<pre>${file}</pre>`,"txt",300,200);

}

}

function goBack(){

if(currentPath.length>1){
currentPath.pop();
renderExplorer();
}

}



/* =========================
   WINDOW DRAGGING
========================= */

document.addEventListener("mousemove",(e)=>{

if(currentWindow){

currentWindow.style.left=(e.clientX-offsetX)+"px";
currentWindow.style.top=(e.clientY-offsetY)+"px";

}

});

document.addEventListener("mouseup",()=>{
currentWindow=null;
});



/* =========================
   BOOT SYSTEM
========================= */

function bootSystem(){

console.log("Booting Windows 2010...");

runFile(["C:","System","System32","ui.dll"]);
runFile(["C:","System","System32","explorer.dll"]);

}



/* =========================
   BOOT SETTINGS
========================= */

(function(){

let bg=registry.HKEY_DESKTOP.BG;
desktop.style.backgroundColor=`rgb(${bg.r},${bg.g},${bg.b})`;

bootSystem();

})();

</script>
</body>
</html>

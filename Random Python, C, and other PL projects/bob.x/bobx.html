<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bob.x | Roblox Clone</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* UI OVERLAY */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* Let clicks pass through to game */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* TOP BAR */
        .top-bar {
            background: rgba(35, 35, 35, 0.8);
            color: white;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .leaderstats { font-weight: bold; }

        /* CHAT BOX */
        .chat-container {
            width: 300px;
            height: 200px;
            background: rgba(0, 0, 0, 0.5);
            margin: 20px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            pointer-events: auto; /* Enable clicking here */
        }
        .chat-history {
            flex: 1;
            overflow-y: auto;
            color: white;
            padding: 10px;
            font-size: 14px;
            text-shadow: 1px 1px 0 #000;
        }
        .chat-input {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 10px;
        }

        /* INSTRUCTIONS */
        #start-screen {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
            pointer-events: auto;
            cursor: pointer;
            z-index: 999;
        }
        h1 { margin: 0 0 10px 0; color: #00b06f; }
        
        /* DEATH SCREEN FLASH */
        #oof-screen {
            position: absolute;
            top:0; left:0; width:100%; height:100%;
            background: red;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
    </style>
</head>
<body>

    <div id="oof-screen"></div>

    <div id="ui-layer">
        <div class="top-bar">
            <div>☰ ⬢ Bob.x</div>
            <div class="leaderstats">Stage: <span id="stage-display">1</span></div>
            <div id="username">Guest_992</div>
            <div id="bobux_val">Bobux: 1</div>
        </div>
        <div class="chat-container">
            <div class="chat-history" id="chat">
                <div style="color: #fabd2f">[System]: Welcome to Mega Fun Obby!</div>
                <div style="color: #8ec07c">[User911]: pls donate bobux</div>
                <div style="color: #8ec07c">[Dapper]: nuh uh 🤣</div>
            </div>
            <input class="chat-input" type="text" placeholder="Press enter to chat...">
        </div>
    </div>

    <div id="start-screen">
        <h1>Bob.x | MEGA FUN OBBY</h1>
        <p>Click to Start</p>
        <p style="font-size: 0.8em; color: #aaa;">WASD to Move | SPACE to Jump | MOUSE to Look</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="game.js"></script>
</body>
</html>
